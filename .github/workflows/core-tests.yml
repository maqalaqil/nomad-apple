name: Portable core tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run portable Swift tests
        run: swift test --package-path apple
      - name: Check project generation
        run: |
          python3 apple/scripts/generate-project.py
          plutil -lint apple/NomadApple.xcodeproj/project.pbxproj
      - name: Check release review utilities
        run: |
          python3 -m py_compile apple/scripts/verify-release.py apple/scripts/inventory-release-crypto.py
          python3 apple/scripts/verify-release.py --help
          python3 apple/scripts/inventory-release-crypto.py --help
          python3 -m json.tool docs/RELEASE_CRYPTO_INVENTORY.json > /dev/null
